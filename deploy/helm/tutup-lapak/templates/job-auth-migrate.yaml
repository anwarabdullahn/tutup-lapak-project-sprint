{{- if and .Values.migrations.enabled .Values.services.auth.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: auth-migrate
  namespace: {{ .Values.global.namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    app: auth-service
    job-type: migration
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ include "tutup-lapak.image" (dict "imageName" "auth-service" "Values" .Values "Chart" .Chart) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          command: ["/bin/sh","-c"]
          args:
            - >-
              if ! command -v migrate >/dev/null 2>&1; then echo 'migrate CLI not in image'; exit 1; fi;
              migrate -path migrations/db -database "$DATABASE_URL" up;
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DATABASE_URL
{{- end }}
