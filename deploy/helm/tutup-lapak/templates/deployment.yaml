{{- range $name, $svc := .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  replicas: {{ $svc.replicaCount }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      containers:
      - name: {{ $name }}
        image: "{{ $svc.image.repository }}:{{ $svc.image.tag }}"
        imagePullPolicy: {{ $svc.image.pullPolicy }}
        ports:
        - containerPort: {{ $svc.service.port }}
        resources:
          {{- toYaml $svc.resources | nindent 10 }}
        env:
        {{- range $key, $value := $svc.env }}
        - name: {{ $key }}
          value: "{{ $value }}"
        {{- end }}
---
{{- end }}
