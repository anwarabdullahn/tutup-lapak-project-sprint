version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: infra_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 10s  # ← Give Postgres time to initialize on first run

  redis:
    image: redis:7-alpine
    container_name: infra_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  backend_infra:
    build:
      context: ./backend-infra
      dockerfile: Dockerfile
    container_name: backend_infra
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
      SERVER_PORT: 3000
      JWT_SECRET: nv6FNtvAmBmUMHRSta8aSZNwiw4XAH
      AUTH_SERVICE_URL: http://auth_service:3001
      PROFILE_SERVICE_URL: http://profile_service:3002
      PRODUCT_SERVICE_URL: http://product_service:3003
      PURCHASE_SERVICE_URL: http://purchase_service:3004

    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy  # ← Wait until Postgres is READY
      redis: 
        condition: service_started        

  auth_service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth_service
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
      SERVER_PORT: 3001
      JWT_SECRET: nv6FNtvAmBmUMHRSta8aSZNwiw4XAH
    ports:
      - "3001:3001"
    depends_on:
      - backend_infra

  profile_service:
    build:
      context: ./profile-service
      dockerfile: Dockerfile
    container_name: profile_service
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
      SERVER_PORT: 3002
      JWT_SECRET: nv6FNtvAmBmUMHRSta8aSZNwiw4XAH
    ports:
      - "3002:3002"                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   
    depends_on:
      - backend_infra 

  product_service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product_service
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
      PORT: 3003
      AUTO_MIGRATE: "true"
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  purchase_service:
    build:
      context: ./purchase-service
      dockerfile: Dockerfile
    container_name: purchase_service
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
      SERVER_PORT: 3004
      JWT_SECRET: nv6FNtvAmBmUMHRSta8aSZNwiw4XAH
      PRODUCT_SERVICE_URL: http://product_service:3003
      USER_SERVICE_URL: http://profile_service:3002
      INTERNAL_SECRET: backend-infra-internal-secret
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      product_service:
        condition: service_started
      profile_service:
        condition: service_started

volumes:
  pgdata:
  redisdata:

